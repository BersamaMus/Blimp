name: blimp
description: "Blimp, a music player for the songs on your Android device."
publish_to: 'none'

# name+build number: versionName and versionCode on Android. Raise the build
# number for every upload to Google Play.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.6
  # A copy with Android Auto browsing added; see packages/just_audio_background/BLIMP_CHANGES.md.
  just_audio_background:
    path: packages/just_audio_background
  audio_service: ^0.18.18
  # Sets up the app's channels to Android on every engine; see packages/engine_hooks.
  engine_hooks:
    path: packages/engine_hooks
  audio_session: ^0.2.4
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
