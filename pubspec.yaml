name: blimp
description: "Blimp, an offline music player for the songs on your device."
publish_to: 'none'

# name+build number: versionName and versionCode on Android. Raise the build
# number for every upload to Google Play.
version: 1.3.0+5

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.6
  # A copy with Android Auto browsing added; see packages/just_audio_background/BLIMP_CHANGES.md.
  just_audio_background:
    path: packages/just_audio_background
  audio_service: ^0.18.18
  # Sets up the app's channels to Android on every engine; see packages/engine_hooks.
  engine_hooks:
    path: packages/engine_hooks
  audio_session: ^0.2.4
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  # A copy that stops mpv loading a song's .lrc file; see packages/just_audio_media_kit/BLIMP_CHANGES.md.
  just_audio_media_kit:
    path: packages/just_audio_media_kit
  media_kit_libs_windows_audio: ^1.0.9
  audio_metadata_reader: ^1.8.0
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.18.0

flutter:
  uses-material-design: true

# The Microsoft Store package: dart run msix:create
# The three identity values come from Partner Center (the app's Product
# management > Product identity page) and must match it exactly. The Store signs
# the package, so it isn't signed here.
msix_config:
  display_name: Blimp Music Player
  publisher_display_name: BersamaMus
  identity_name: BersamaMus.BlimpMusicPlayer
  publisher: CN=11D4E812-15F4-4555-8861-ABF21C21C9AC
  msix_version: 1.3.0.0
  logo_path: store_listing/icon_512.png
  languages: en-us
  store: true
  # Offered in "Open with" for songs.
  file_extension: .mp3, .flac, .m4a, .aac, .ogg, .oga, .opus, .wav, .wma, .aiff, .aif
  output_path: build/msix
  output_name: Blimp
